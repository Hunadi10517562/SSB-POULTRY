<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SSB Poultry | Product Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo"><h2>SSB Poultry</h2></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html" class="active">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Sales & Product Enquiry Form</h1>
        <form id="enquiryForm" onsubmit="return validateForm(event)">
            <div class="form-group">
                <label for="fullname">Full Name *</label>
                <input type="text" id="fullname" required minlength="3">
                <span class="error-message" id="nameError">Please enter at least 3 characters.</span>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" required>
                <span class="error-message" id="emailError">Please enter a valid email address.</span>
            </div>

            <div class="form-group">
                <label for="productSelect">Select Product *</label>
                <select id="productSelect" required onchange="calculateTotal()">
                    <option value="">-- Choose Product --</option>
                    <option value="14.50">Day-Old Chicks (R14.50)</option>
                    <option value="75.00">Live Broiler (R75.00)</option>
                    <option value="65.00">Fresh Egg Tray (R65.00)</option>
                    <option value="380.00">Poultry Feed 50kg (R380.00)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity *</label>
                <input type="number" id="quantity" min="1" value="1" required onchange="calculateTotal()" oninput="calculateTotal()">
            </div>

            <div class="card" style="margin-bottom: 15px; background: #fffbe6;">
                <h3>Estimated Subtotal: R <span id="totalDisplay">0.00</span></h3>
            </div>

            <button type="submit" class="btn">Submit Order Enquiry</button>
        </form>
    </main>

    <script>
        function calculateTotal() {
            const price = parseFloat(document.getElementById('productSelect').value) || 0;
            const qty = parseInt(document.getElementById('quantity').value) || 0;
            const total = price * qty;
            document.getElementById('totalDisplay').textContent = total.toFixed(2);
        }

        function validateForm(event) {
            event.preventDefault();
            const name = document.getElementById('fullname').value;
            if(name.trim().length < 3) {
                document.getElementById('nameError').style.display = 'block';
                return false;
            }
            document.getElementById('nameError').style.display = 'none';
            alert('Enquiry submitted successfully! We will get back to you soon.');
            return true;
        }
    </script>
</body>
</html>
